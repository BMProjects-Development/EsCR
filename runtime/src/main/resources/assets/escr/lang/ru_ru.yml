book.escr:
  title:
    basics: Основы
  entry:
    welcome:
      title: Привет, мир!
      description: Где я?
      content:
        1: Мир - существо неизведанное. Происхождение над которым, ученые думают уже ни первый десяток лет.
        2: Что действительно происходит в этом "существе"?
        3: Именно это Вам и придется выяснить. Вам придется понять устройство данного мира, что с ним не так, 
          обуздать технологии той, иной цивилизации и понять, что именно произошло с той самой цивилизацией. 
          И почему некоторые вещи и технологии проникли и/или проникают к нам в измерение до сих пор.

