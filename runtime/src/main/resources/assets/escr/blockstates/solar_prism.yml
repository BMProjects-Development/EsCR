multipart:
  - apply:
      model: escr:block/solar_prism/post
  - apply:
      model: escr:block/solar_prism/side
    when:
      north: "false"
  - apply:
      model: escr:block/solar_prism/side
      y: 90
    when:
      east: "false"
  - apply:
      model: escr:block/solar_prism/side
      y: 180
    when:
      south: "false"
  - apply:
      model: escr:block/solar_prism/side
      y: 270
    when:
      west: "false"
